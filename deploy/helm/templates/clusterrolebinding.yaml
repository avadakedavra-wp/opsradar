{{- if eq .Values.rbac.scope "cluster" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "opsradar.fullname" . }}
  labels:
    {{- include "opsradar.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "opsradar.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "opsradar.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
