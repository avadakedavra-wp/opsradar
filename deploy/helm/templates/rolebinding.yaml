{{- if eq .Values.rbac.scope "namespace" }}
{{- range .Values.rbac.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "opsradar.fullname" $ }}
  namespace: {{ . }}
  labels:
    {{- include "opsradar.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "opsradar.fullname" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "opsradar.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
