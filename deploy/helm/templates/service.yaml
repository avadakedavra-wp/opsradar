apiVersion: v1
kind: Service
metadata:
  name: {{ include "opsradar.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opsradar.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.api.type }}
  selector:
    {{- include "opsradar.selectorLabels" . | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.service.api.port }}
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opsradar.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opsradar.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.dashboard.type }}
  selector:
    {{- include "opsradar.selectorLabels" . | nindent 4 }}
  ports:
    - name: dashboard
      port: {{ .Values.service.dashboard.port }}
      targetPort: 3000
